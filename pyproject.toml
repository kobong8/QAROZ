[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qaroz"
version = "1.0.0"
description = "Local-first QA orchestration for Windows web applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["qa_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

